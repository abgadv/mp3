<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>Video → MP3</title>
<style>
body{
    font-family:sans-serif;
    max-width:500px;
    margin:40px auto;
}
</style>
</head>

<body>

<h2>استخراج الصوت من الفيديو</h2>
<input type="file" id="inputVideo" accept="video/*">
<button id="convertBtn">تحويل</button>
<div id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js"></script>
<script>
const { createFFmpeg, fetchFile } = FFmpeg;
const ffmpeg = createFFmpeg({
    log: true,
    corePath: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/ffmpeg-core.js"
});

const input = document.getElementById("inputVideo");
const btn = document.getElementById("convertBtn");
const statusEl = document.getElementById("status");

function setStatus(t){ statusEl.textContent = t; }

btn.onclick = async () => {
  const file = input.files[0];
  if(!file){
    alert("اختر فيديو");
    return;
  }

  btn.disabled = true;
  setStatus("تجهيز المحول...");

  if(!ffmpeg.isLoaded()){
    await ffmpeg.load();
  }

  setStatus("جار التحويل...");
  ffmpeg.FS("writeFile","input", await fetchFile(file));
  await ffmpeg.run("-i","input","-vn","-acodec","libmp3lame","output.mp3");

  const data = ffmpeg.FS("readFile","output.mp3");
  const url = URL.createObjectURL(new Blob([data.buffer],{type:"audio/mp3"}));

  const a = document.createElement("a");
  a.href = url;
  a.download = file.name.replace(/\.[^/.]+$/, "") + ".mp3";
  a.click();

  setStatus("تم التحويل ✔️");
  btn.disabled = false;
};
</script>

</body>
</html>
